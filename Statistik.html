<div class="view" id="view-statistik">

  <div class="filter-bar">
    <div class="field">
      <label>Rentang</label>
      <select id="statRange" onchange="loadStatistik()">
        <option value="7">7 hari terakhir</option>
        <option value="30">30 hari terakhir</option>
        <option value="90">90 hari terakhir</option>
      </select>
    </div>
  </div>

  <div class="grid grid-4" style="margin-bottom:18px;">
    <div class="card stat-card">
      <div class="label">Total Layanan</div>
      <div class="value" id="statTotal">0</div>
    </div>
    <div class="card stat-card accent-green">
      <div class="label">Selesai</div>
      <div class="value" id="statSelesai">0</div>
    </div>
    <div class="card stat-card accent-brass">
      <div class="label">Rata-rata Rating</div>
      <div class="value" id="statRating">—</div>
    </div>
    <div class="card stat-card">
      <div class="label">Rata-rata Durasi</div>
      <div class="value" id="statDurasi">—</div>
    </div>
  </div>

  <div class="grid grid-2">
    <div class="card card-pad">
      <div class="section-title">Antrian per Hari</div>
      <canvas id="chartHarian" height="160"></canvas>
    </div>
    <div class="card card-pad">
      <div class="section-title">Layanan Terpopuler</div>
      <canvas id="chartJenis" height="160"></canvas>
    </div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
