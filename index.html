<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('Stylesheet'); ?>
</head>
<body>

  <!-- ===================== LOGIN / KIOSK (belum masuk) ===================== -->
  <div id="authScreen" class="center-screen">
    <div class="auth-card">
      <div class="seal">KP</div>
      <h1>SiPADU</h1>
      <div class="sub">Sistem Pelayanan Terpadu &middot; KPKNL Denpasar</div>

      <div class="auth-tabs">
        <div class="auth-tab active" data-tab="kiosk" onclick="switchAuthTab('kiosk')">Ambil Antrian</div>
        <div class="auth-tab" data-tab="staff" onclick="switchAuthTab('staff')">Login Petugas</div>
      </div>

      <!-- Ambil antrian (publik) -->
      <div id="tab-kiosk">
        <div class="field">
          <label for="k_nama">Nama Pemohon</label>
          <input id="k_nama" placeholder="Nama lengkap">
        </div>
        <div class="field-row">
          <div class="field">
            <label for="k_hp">No. HP</label>
            <input id="k_hp" placeholder="08xxxxxxxxxx">
          </div>
          <div class="field">
            <label for="k_email">Email</label>
            <input id="k_email" placeholder="nama@email.com">
          </div>
        </div>
        <div class="field">
          <label for="k_jenis">Jenis Layanan</label>
          <select id="k_jenis"></select>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="k_jumlah">Jumlah Pengunjung</label>
            <input id="k_jumlah" type="number" min="1" value="1">
          </div>
          <div class="field">
            <label for="k_uraian">Keperluan (singkat)</label>
            <input id="k_uraian" placeholder="mis. legalisir dokumen">
          </div>
        </div>
        <button class="btn btn-brass btn-block" onclick="ambilAntrian()">Ambil Nomor Antrian</button>
        <div id="kioskResult"></div>
      </div>

      <!-- Login petugas -->
      <div id="tab-staff" style="display:none;">
        <div class="field">
          <label for="s_nip">NIP</label>
          <input id="s_nip" placeholder="Nomor Induk Pegawai">
        </div>
        <div class="field">
          <label for="s_pass">Password</label>
          <input id="s_pass" type="password" placeholder="&bull;&bull;&bull;&bull;&bull;">
        </div>
        <button class="btn btn-primary btn-block" onclick="loginStaff()">Masuk</button>
        <div class="error-msg" id="staffError"></div>
      </div>
    </div>
  </div>

  <!-- ===================== APP (setelah petugas login) ===================== -->
  <div id="app" style="display:none;">
    <aside class="sidebar">
      <div class="brand">
        <div class="seal">KP</div>
        <div class="brand-text">
          <div class="t1">SiPADU</div>
          <div class="t2">KPKNL DENPASAR</div>
        </div>
      </div>

      <div class="nav-group-label">Menu</div>
      <div class="nav-item active" data-view="dashboard" onclick="showView('dashboard')"><span class="ic">&#9632;</span> Dashboard</div>
      <div class="nav-item" data-view="antrian" onclick="showView('antrian')"><span class="ic">&#128203;</span> Antrian</div>
      <div class="nav-item" data-view="statistik" onclick="showView('statistik')"><span class="ic">&#128200;</span> Statistik</div>
      <div class="nav-item" data-view="pegawai" onclick="showView('pegawai')"><span class="ic">&#128100;</span> Pegawai</div>

      <div class="sidebar-footer">
        <div class="petugas-card">
          <b id="sfNama">-</b>
          <span id="sfJabatan">-</span>
        </div>
        <button class="logout-btn" onclick="logoutStaff()">Keluar</button>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div class="page-title" id="pageTitle">Dashboard</div>
        <div class="today" id="todayLabel"></div>
      </div>

      <div class="content">
        <?!= include('Dashboard'); ?>
        <?!= include('Antrian'); ?>
        <?!= include('Statistik'); ?>
        <?!= include('Pegawai'); ?>
      </div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <?!= include('JavaScript'); ?>
</body>
</html>
