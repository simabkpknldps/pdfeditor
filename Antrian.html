<div class="view" id="view-antrian">

  <div class="filter-bar">
    <div class="field">
      <label>Tanggal</label>
      <input type="date" id="antTanggal">
    </div>
    <div class="field">
      <label>Status</label>
      <select id="antStatus">
        <option>Semua</option>
        <option>Menunggu</option>
        <option>Diproses</option>
        <option>Selesai</option>
        <option>Dibatalkan</option>
      </select>
    </div>
    <button class="btn btn-primary" onclick="loadAntrian()">Terapkan Filter</button>
    <button class="btn btn-ghost" onclick="document.getElementById('antTanggal').value='';document.getElementById('antStatus').value='Semua';loadAntrian();">Reset</button>
  </div>

  <div class="card card-pad">
    <div class="section-title">Daftar Antrian</div>
    <div class="ticket-list" id="antrianList"></div>
  </div>
</div>

<!-- Modal sederhana untuk selesaikan / batalkan -->
<div id="tindakanModal" style="display:none; position:fixed; inset:0; background:rgba(8,24,47,.45); z-index:200; align-items:center; justify-content:center;">
  <div class="card card-pad" style="width:380px;">
    <h3 style="margin-bottom:14px;">Catatan Tindakan</h3>
    <div class="field">
      <label>Nomor Antrian</label>
      <input id="modalId" disabled>
    </div>
    <div class="field">
      <label>Tindakan / Catatan Petugas</label>
      <textarea id="modalTindakan" rows="3" placeholder="mis. dokumen diverifikasi dan diserahkan"></textarea>
    </div>
    <div style="display:flex; gap:8px; justify-content:flex-end;">
      <button class="btn btn-ghost" onclick="closeModal()">Batal</button>
      <button class="btn btn-primary" id="modalConfirmBtn">Simpan</button>
    </div>
  </div>
</div>
