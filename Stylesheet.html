<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root{
    --navy-900:#08182F;
    --navy-800:#0B2545;
    --navy-700:#173A6B;
    --brass:#B8935B;
    --brass-light:#E4D2AC;
    --paper:#F7F5EE;
    --paper-dim:#EFEBDF;
    --ink:#1C2430;
    --slate:#4A5568;
    --green:#2F6B4F;
    --green-bg:#E4EFE8;
    --amber:#C08A2E;
    --amber-bg:#FBF0DD;
    --maroon:#A63D40;
    --maroon-bg:#F6E5E4;
    --line:#DCD6C4;
    --radius:10px;
    --shadow:0 1px 2px rgba(11,37,69,.06), 0 6px 20px rgba(11,37,69,.06);
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:'IBM Plex Sans', sans-serif;
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{ font-family:'Source Serif 4', serif; margin:0; letter-spacing:.1px; }
  .mono{ font-family:'IBM Plex Mono', monospace; }

  /* ===== App shell ===== */
  #app{ display:flex; min-height:100vh; }

  /* ===== Sidebar ===== */
  .sidebar{
    width:232px; flex-shrink:0;
    background:var(--navy-900);
    color:var(--paper);
    display:flex; flex-direction:column;
    padding:22px 16px;
  }
  .brand{ display:flex; align-items:center; gap:10px; padding:6px 6px 20px; border-bottom:1px solid rgba(247,245,238,.12); margin-bottom:16px;}
  .seal{
    width:34px;height:34px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--brass-light), var(--brass) 60%, #8f6d3c 100%);
    display:flex;align-items:center;justify-content:center;
    font-family:'Source Serif 4',serif; font-weight:700; font-size:13px; color:var(--navy-900);
    flex-shrink:0;
  }
  .brand-text{ line-height:1.15; }
  .brand-text .t1{ font-family:'Source Serif 4',serif; font-weight:600; font-size:15px; }
  .brand-text .t2{ font-size:10.5px; color:var(--brass-light); letter-spacing:.4px; }

  .nav-group-label{ font-size:10px; text-transform:uppercase; letter-spacing:1px; color:rgba(247,245,238,.45); margin:14px 10px 6px; }
  .nav-item{
    display:flex; align-items:center; gap:10px;
    padding:9px 12px; border-radius:8px; cursor:pointer;
    font-size:13.5px; color:rgba(247,245,238,.85);
    transition:background .15s ease, color .15s ease;
  }
  .nav-item .ic{ width:16px; text-align:center; opacity:.85; }
  .nav-item:hover{ background:rgba(247,245,238,.06); }
  .nav-item.active{ background:var(--brass); color:var(--navy-900); font-weight:600; }
  .nav-item.active .ic{ opacity:1; }

  .sidebar-footer{ margin-top:auto; padding-top:14px; border-top:1px solid rgba(247,245,238,.12); }
  .petugas-card{ font-size:12px; color:rgba(247,245,238,.75); padding:8px 10px; }
  .petugas-card b{ display:block; color:var(--paper); font-size:13px; }
  .logout-btn{
    width:100%; margin-top:8px; padding:8px 10px; border-radius:8px;
    background:transparent; border:1px solid rgba(247,245,238,.25); color:rgba(247,245,238,.85);
    font-size:12.5px; cursor:pointer; font-family:inherit;
  }
  .logout-btn:hover{ background:rgba(247,245,238,.08); }

  /* ===== Main ===== */
  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar{
    height:60px; flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
    padding:0 28px; border-bottom:1px solid var(--line); background:#fff;
  }
  .topbar .page-title{ font-size:19px; }
  .topbar .today{ font-size:12.5px; color:var(--slate); }
  .content{ flex:1; padding:28px; max-width:1180px; width:100%; margin:0 auto; }

  .view{ display:none; animation:fadeIn .25s ease; }
  .view.active{ display:block; }
  @keyframes fadeIn{ from{ opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  /* ===== Cards / grids ===== */
  .grid{ display:grid; gap:16px; }
  .grid-4{ grid-template-columns:repeat(4,1fr); }
  .grid-2{ grid-template-columns:1.3fr .7fr; }
  @media(max-width:900px){ .grid-4{ grid-template-columns:repeat(2,1fr);} .grid-2{ grid-template-columns:1fr;} }

  .card{ background:#fff; border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); }
  .card-pad{ padding:20px; }
  .stat-card{ padding:18px 20px; }
  .stat-card .label{ font-size:11.5px; text-transform:uppercase; letter-spacing:.6px; color:var(--slate); }
  .stat-card .value{ font-family:'Source Serif 4',serif; font-size:34px; font-weight:600; margin-top:6px; color:var(--navy-800); }
  .stat-card.accent-brass .value{ color:var(--brass); }
  .stat-card.accent-green .value{ color:var(--green); }
  .stat-card.accent-amber .value{ color:var(--amber); }

  /* ===== "Now serving" board — signature element ===== */
  .now-serving{
    background:var(--navy-900);
    border-radius:var(--radius);
    color:var(--paper);
    padding:22px 26px;
    display:flex; align-items:center; justify-content:space-between; gap:20px;
    position:relative; overflow:hidden;
  }
  .now-serving::before{
    content:''; position:absolute; inset:0;
    background:repeating-linear-gradient(90deg, rgba(184,147,91,.07) 0 2px, transparent 2px 26px);
  }
  .now-serving .ns-label{ font-size:11px; text-transform:uppercase; letter-spacing:1.5px; color:var(--brass-light); position:relative; }
  .now-serving .ns-number{
    font-family:'IBM Plex Mono', monospace; font-size:40px; font-weight:600; letter-spacing:1px;
    margin-top:4px; position:relative;
  }
  .now-serving .ns-name{ font-size:13px; color:rgba(247,245,238,.8); margin-top:2px; position:relative; }
  .now-serving .ns-empty{ font-size:14px; color:rgba(247,245,238,.55); position:relative; }
  .blink{ animation:blink 1.4s steps(1) infinite; }
  @keyframes blink{ 50%{ opacity:.35; } }

  /* ===== Tickets (queue list) ===== */
  .ticket-list{ display:flex; flex-direction:column; gap:10px; }
  .ticket{
    display:flex; align-items:center; gap:14px;
    border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; background:#fff;
    position:relative;
  }
  .ticket::before{
    content:''; position:absolute; left:-1px; top:50%; transform:translateY(-50%);
    width:10px; height:10px; border-radius:50%; background:var(--paper); border:1px solid var(--line);
  }
  .ticket-id{
    font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:14px;
    background:var(--paper-dim); border-radius:7px; padding:8px 10px; color:var(--navy-800); flex-shrink:0;
  }
  .ticket-info{ flex:1; min-width:0; }
  .ticket-info .n{ font-weight:600; font-size:14px; }
  .ticket-info .s{ font-size:12.5px; color:var(--slate); }
  .badge{ font-size:11px; font-weight:600; padding:4px 9px; border-radius:20px; white-space:nowrap; }
  .badge.Menunggu{ background:var(--amber-bg); color:var(--amber); }
  .badge.Diproses{ background:#E4ECF6; color:var(--navy-700); }
  .badge.Selesai{ background:var(--green-bg); color:var(--green); }
  .badge.Dibatalkan{ background:var(--maroon-bg); color:var(--maroon); }
  .ticket-actions{ display:flex; gap:6px; flex-shrink:0; }

  /* ===== Buttons ===== */
  .btn{
    font-family:inherit; font-size:12.5px; font-weight:600; cursor:pointer;
    border-radius:7px; padding:7px 12px; border:1px solid transparent; transition:filter .15s;
  }
  .btn:hover{ filter:brightness(0.95); }
  .btn-primary{ background:var(--navy-800); color:#fff; }
  .btn-brass{ background:var(--brass); color:var(--navy-900); }
  .btn-ghost{ background:#fff; border-color:var(--line); color:var(--ink); }
  .btn-danger{ background:var(--maroon-bg); color:var(--maroon); }
  .btn-sm{ padding:5px 9px; font-size:11.5px; }
  .btn-block{ width:100%; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }

  /* ===== Forms ===== */
  label{ display:block; font-size:12px; font-weight:600; color:var(--slate); margin-bottom:5px; }
  input, select, textarea{
    width:100%; font-family:inherit; font-size:13.5px; padding:9px 11px;
    border:1px solid var(--line); border-radius:7px; background:#fff; color:var(--ink);
  }
  input:focus, select:focus, textarea:focus{ outline:2px solid var(--brass); outline-offset:1px; border-color:var(--brass); }
  .field{ margin-bottom:14px; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }

  .filter-bar{ display:flex; gap:10px; align-items:flex-end; margin-bottom:16px; flex-wrap:wrap; }
  .filter-bar .field{ margin-bottom:0; }

  .empty-state{ text-align:center; padding:40px 20px; color:var(--slate); }
  .empty-state .ic{ font-size:26px; margin-bottom:8px; }

  .section-title{ font-size:15px; margin-bottom:12px; display:flex; align-items:center; justify-content:space-between; }

  .toast{
    position:fixed; bottom:22px; right:22px; background:var(--navy-900); color:#fff;
    padding:12px 16px; border-radius:8px; font-size:13px; box-shadow:var(--shadow);
    display:flex; align-items:center; gap:10px; z-index:999; transform:translateY(8px); opacity:0;
    transition:all .25s ease; pointer-events:none;
  }
  .toast.show{ transform:translateY(0); opacity:1; }
  .toast.error{ background:var(--maroon); }

  /* ===== Login / Public views ===== */
  .center-screen{ min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--navy-900); padding:20px; }
  .auth-card{ width:380px; background:var(--paper); border-radius:14px; padding:32px 30px; box-shadow:0 20px 60px rgba(0,0,0,.35); }
  .auth-card .seal{ width:46px; height:46px; font-size:17px; margin-bottom:14px; }
  .auth-card h1{ font-size:21px; }
  .auth-card .sub{ font-size:12.5px; color:var(--slate); margin-top:4px; margin-bottom:22px; }
  .auth-tabs{ display:flex; gap:6px; margin-bottom:20px; background:var(--paper-dim); padding:4px; border-radius:9px; }
  .auth-tab{ flex:1; text-align:center; padding:7px; border-radius:6px; font-size:12.5px; font-weight:600; cursor:pointer; color:var(--slate); }
  .auth-tab.active{ background:#fff; color:var(--navy-800); box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .error-msg{ font-size:12px; color:var(--maroon); margin-top:8px; min-height:16px; }

  .kiosk-result{ text-align:center; padding:30px 10px; }
  .kiosk-result .ticket-id{ font-size:30px; padding:16px 22px; display:inline-block; margin-top:10px; }

  .stars{ display:flex; gap:6px; font-size:24px; cursor:pointer; }
  .stars span{ color:var(--line); }
  .stars span.on{ color:var(--brass); }

  ::-webkit-scrollbar{ width:9px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:20px; }
</style>
