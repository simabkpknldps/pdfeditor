<script>
  let currentPetugas = null;
  let charts = {};

  document.addEventListener('DOMContentLoaded', function () {
    document.getElementById('todayLabel').textContent = new Date().toLocaleDateString('id-ID', {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
    });
    document.getElementById('antTanggal').value = new Date().toISOString().slice(0, 10);
    loadJenisLayanan();
  });

  /* ================= TOAST ================= */
  function toast(msg, isError) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast show' + (isError ? ' error' : '');
    setTimeout(() => el.className = 'toast', 2400);
  }

  /* ================= AUTH TABS ================= */
  function switchAuthTab(tab) {
    document.querySelectorAll('.auth-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
    document.getElementById('tab-kiosk').style.display = tab === 'kiosk' ? 'block' : 'none';
    document.getElementById('tab-staff').style.display = tab === 'staff' ? 'block' : 'none';
  }

  /* ================= AMBIL ANTRIAN (PUBLIK) ================= */
  function loadJenisLayanan() {
    google.script.run.withSuccessHandler(list => {
      const sel = document.getElementById('k_jenis');
      sel.innerHTML = list.map(j => `<option>${j}</option>`).join('');
    }).getJenisLayananList();
  }

  function ambilAntrian() {
    const form = {
      nama: document.getElementById('k_nama').value.trim(),
      no_hp: document.getElementById('k_hp').value.trim(),
      email: document.getElementById('k_email').value.trim(),
      jenis_layanan: document.getElementById('k_jenis').value,
      jumlah_pengunjung: document.getElementById('k_jumlah').value,
      uraian_layanan: document.getElementById('k_uraian').value.trim()
    };
    if (!form.nama) { toast('Nama wajib diisi.', true); return; }

    google.script.run
      .withSuccessHandler(res => {
        document.getElementById('kioskResult').innerHTML = `
          <div class="kiosk-result">
            <div style="font-size:12.5px;color:var(--slate);">Nomor antrian Anda</div>
            <div class="ticket-id mono">${res.id}</div>
            <div style="font-size:12px;color:var(--slate);margin-top:10px;">Simpan nomor ini dan tunggu panggilan petugas.</div>
          </div>`;
      })
      .withFailureHandler(err => toast('Gagal mengambil antrian: ' + err.message, true))
      .submitAntrian(form);
  }

  /* ================= LOGIN PETUGAS ================= */
  function loginStaff() {
    const nip = document.getElementById('s_nip').value.trim();
    const pass = document.getElementById('s_pass').value;
    document.getElementById('staffError').textContent = '';

    google.script.run
      .withSuccessHandler(res => {
        if (!res.ok) { document.getElementById('staffError').textContent = res.message; return; }
        currentPetugas = res.petugas;
        document.getElementById('sfNama').textContent = currentPetugas.nama;
        document.getElementById('sfJabatan').textContent = currentPetugas.jabatan;
        document.getElementById('authScreen').style.display = 'none';
        document.getElementById('app').style.display = 'flex';
        showView('dashboard');
      })
      .withFailureHandler(err => document.getElementById('staffError').textContent = err.message)
      .loginPegawai(nip, pass);
  }

  function logoutStaff() {
    currentPetugas = null;
    document.getElementById('app').style.display = 'none';
    document.getElementById('authScreen').style.display = 'flex';
    document.getElementById('s_pass').value = '';
  }

  /* ================= ROUTING SPA (tanpa reload) ================= */
  function showView(name) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById('view-' + name).classList.add('active');
    document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.view === name));

    const titles = { dashboard: 'Dashboard', antrian: 'Antrian', statistik: 'Statistik', pegawai: 'Manajemen Pegawai' };
    document.getElementById('pageTitle').textContent = titles[name];

    if (name === 'dashboard') loadDashboard();
    if (name === 'antrian') loadAntrian();
    if (name === 'statistik') loadStatistik();
    if (name === 'pegawai') loadPegawai();
  }

  /* ================= DASHBOARD ================= */
  function loadDashboard() {
    google.script.run.withSuccessHandler(d => {
      document.getElementById('dashTotal').textContent = d.total;
      document.getElementById('dashMenunggu').textContent = d.menunggu;
      document.getElementById('dashDiproses').textContent = d.diproses;
      document.getElementById('dashSelesai').textContent = d.selesai;

      if (d.sedangDilayani) {
        document.getElementById('dashNowNumber').textContent = d.sedangDilayani.id;
        document.getElementById('dashNowName').textContent = d.sedangDilayani.nama + ' — oleh ' + (d.sedangDilayani.petugas || '-');
      } else {
        document.getElementById('dashNowNumber').textContent = '— — —';
        document.getElementById('dashNowName').textContent = 'Belum ada antrian diproses';
      }

      const list = document.getElementById('dashNextList');
      if (!d.antrianBerikutnya.length) {
        list.innerHTML = `<div class="empty-state"><div class="ic">&#128203;</div>Tidak ada antrian menunggu.</div>`;
      } else {
        list.innerHTML = d.antrianBerikutnya.map(r => `
          <div class="ticket">
            <div class="ticket-id mono">${r.id}</div>
            <div class="ticket-info">
              <div class="n">${r.nama}</div>
              <div class="s">${r.jenis_layanan}</div>
            </div>
            <span class="badge Menunggu">Menunggu</span>
          </div>`).join('');
      }
    }).getDashboardData();
  }

  /* ================= ANTRIAN ================= */
  function loadAntrian() {
    const filter = {
      tanggal: document.getElementById('antTanggal').value,
      status: document.getElementById('antStatus').value
    };
    google.script.run.withSuccessHandler(rows => {
      const list = document.getElementById('antrianList');
      if (!rows.length) {
        list.innerHTML = `<div class="empty-state"><div class="ic">&#128203;</div>Tidak ada data untuk filter ini.</div>`;
        return;
      }
      list.innerHTML = rows.map(r => renderTicket(r)).join('');
    }).getAntrianList(filter);
  }

  function renderTicket(r) {
    const status = r.status_pegawai || 'Menunggu';
    let actions = '';
    if (status === 'Menunggu') {
      actions = `<button class="btn btn-brass btn-sm" onclick="panggil('${r.id}')">Panggil</button>
                 <button class="btn btn-danger btn-sm" onclick="openModal('${r.id}','batal')">Batalkan</button>`;
    } else if (status === 'Diproses') {
      actions = `<button class="btn btn-primary btn-sm" onclick="openModal('${r.id}','selesai')">Selesaikan</button>`;
    }
    return `
      <div class="ticket">
        <div class="ticket-id mono">${r.id}</div>
        <div class="ticket-info">
          <div class="n">${r.nama} <span style="color:var(--slate);font-weight:400;">&middot; ${r.jenis_layanan}</span></div>
          <div class="s">${r.uraian_layanan || '-'} &middot; petugas: ${r.nama_petugas || '-'}</div>
        </div>
        <span class="badge ${status}">${status}</span>
        <div class="ticket-actions">${actions}</div>
      </div>`;
  }

  function panggil(id) {
    if (!currentPetugas) { toast('Silakan login sebagai petugas.', true); return; }
    google.script.run.withSuccessHandler(() => { toast('Antrian ' + id + ' dipanggil.'); loadAntrian(); loadDashboard(); })
      .panggilAntrian(id, currentPetugas.nama);
  }

  let modalCtx = null;
  function openModal(id, type) {
    modalCtx = { id, type };
    document.getElementById('modalId').value = id;
    document.getElementById('modalTindakan').value = '';
    document.getElementById('tindakanModal').style.display = 'flex';
    document.getElementById('modalConfirmBtn').onclick = confirmModal;
  }
  function closeModal() { document.getElementById('tindakanModal').style.display = 'none'; modalCtx = null; }

  function confirmModal() {
    const tindakan = document.getElementById('modalTindakan').value.trim();
    const fn = modalCtx.type === 'selesai' ? 'selesaikanAntrian' : 'batalkanAntrian';
    google.script.run.withSuccessHandler(() => {
      toast('Antrian ' + modalCtx.id + ' diperbarui.');
      closeModal(); loadAntrian(); loadDashboard();
    })[fn](modalCtx.id, currentPetugas ? currentPetugas.nama : '', tindakan);
  }

  /* ================= STATISTIK ================= */
  function loadStatistik() {
    const days = Number(document.getElementById('statRange').value);
    google.script.run.withSuccessHandler(d => {
      document.getElementById('statTotal').textContent = d.totalLayanan;
      document.getElementById('statSelesai').textContent = d.selesai;
      document.getElementById('statRating').textContent = d.avgRating ? d.avgRating.toFixed(1) + ' / 5' : '—';
      document.getElementById('statDurasi').textContent = d.avgDurasiMenit ? Math.round(d.avgDurasiMenit) + ' mnt' : '—';

      renderChart('chartHarian', 'bar', Object.keys(d.perHari), Object.values(d.perHari), '#0B2545');
      renderChart('chartJenis', 'bar', Object.keys(d.perJenis), Object.values(d.perJenis), '#B8935B');
    }).getStatistikData({ days });
  }

  function renderChart(canvasId, type, labels, data, color) {
    if (charts[canvasId]) charts[canvasId].destroy();
    const ctx = document.getElementById(canvasId).getContext('2d');
    charts[canvasId] = new Chart(ctx, {
      type,
      data: { labels, datasets: [{ data, backgroundColor: color, borderRadius: 5 }] },
      options: {
        plugins: { legend: { display: false } },
        scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
      }
    });
  }

  /* ================= PEGAWAI ================= */
  function loadPegawai() {
    google.script.run.withSuccessHandler(list => {
      const el = document.getElementById('pegawaiList');
      el.innerHTML = list.map(p => `
        <div class="ticket">
          <div class="ticket-info">
            <div class="n">${p.nama}</div>
            <div class="s">${p.jabatan} &middot; ${p.pangkat} &middot; NIP ${p.nip}</div>
          </div>
          <span class="badge ${Number(p.keaktifan) === 1 ? 'Selesai' : 'Dibatalkan'}">${Number(p.keaktifan) === 1 ? 'Aktif' : 'Nonaktif'}</span>
          <div class="ticket-actions">
            <button class="btn btn-ghost btn-sm" onclick="toggleKeaktifan('${p.nip}', ${Number(p.keaktifan) === 1 ? 0 : 1})">
              ${Number(p.keaktifan) === 1 ? 'Nonaktifkan' : 'Aktifkan'}
            </button>
          </div>
        </div>`).join('');
    }).getPegawaiList();
  }

  function toggleKeaktifan(nip, val) {
    google.script.run.withSuccessHandler(() => { toast('Status pegawai diperbarui.'); loadPegawai(); })
      .setKeaktifanPegawai(nip, val);
  }

  function tambahPegawaiBaru() {
    const form = {
      nama: document.getElementById('p_nama').value.trim(),
      nip: document.getElementById('p_nip').value.trim(),
      jabatan: document.getElementById('p_jabatan').value.trim(),
      pangkat: document.getElementById('p_pangkat').value.trim(),
      status: document.getElementById('p_status').value,
      password: document.getElementById('p_password').value.trim()
    };
    if (!form.nama || !form.nip) { toast('Nama dan NIP wajib diisi.', true); return; }

    google.script.run.withSuccessHandler(() => {
      toast('Pegawai ditambahkan.');
      ['p_nama', 'p_nip', 'p_jabatan', 'p_pangkat'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('p_password').value = '12345';
      loadPegawai();
    }).tambahPegawai(form);
  }
</script>
